# Production stack for OpenWA with automatic HTTPS.
#
#   caddy (:80/:443, Let's Encrypt)  ->  openwa:2785
#                                         ├─ the dashboard SPA (built into the image, SERVE_DASHBOARD)
#                                         ├─ /api/
#                                         └─ /socket.io/
#
# Since OpenWA 0.29 the API serves the dashboard itself, so there is no separate dashboard container.
#
# Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build

services:
  openwa:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    # Give the engine time to close Chromium cleanly on redeploy so it removes
    # its own profile lock (avoids "profile in use" on the next launch).
    stop_grace_period: 30s
    env_file:
      - .env.prod
    environment:
      - PORT=2785
      - SESSION_DATA_PATH=/app/data/sessions
      - STORAGE_LOCAL_PATH=/app/data/media
      - PLUGINS_DIR=/app/data/plugins
      - SERVE_DASHBOARD=true
      # Redis: cache, rate-limit store, Socket.IO fan-out, and the BullMQ webhook queue.
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_ENABLED=true
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - '2785'
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        ['CMD', 'node', '-e', "require('http').get('http://localhost:2785/api/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: openwa-redis
    restart: unless-stopped
    # Same flags as upstream's compose: durable (AOF) and never evicts queue keys.
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    expose:
      - '6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: openwa-caddy
    restart: unless-stopped
    depends_on:
      - openwa
    ports:
      - '80:80'
      - '443:443'
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  openwa-data:
  redis-data:
  caddy-data:
  caddy-config:
